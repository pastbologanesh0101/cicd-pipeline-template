name: CI/CD Pipeline

# Multi-stage pipeline: lint -> test (matrix) -> security-scan -> build.
# Build only runs once lint, test, AND security-scan have all passed,
# expressed via `needs:`. See README.md for the full rationale behind
# each stage and how to extend the "build" stage into a real deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run ruff (style + correctness lint)
        run: ruff check .

      - name: Run black (formatting check, no changes applied)
        run: black --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  security-scan:
    name: Security scan (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt

      - name: Run bandit (static security analysis of app code)
        run: bandit -r app -q

  docker-lint:
    name: Docker lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lints the Dockerfile itself (best-practice rules: layer
      # ordering, pinned base image tags, avoiding unnecessary
      # root usage, etc.) — distinct from ruff/black, which only
      # look at Python source, and from bandit, which only looks
      # at application code, not the container definition.
      - name: Run hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan, docker-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only: proves the image builds cleanly. No registry login
      # or push happens here, so this job needs no cloud credentials.
      # A real deployment pipeline would add steps here such as:
      #
      #   - name: Log in to registry
      #     uses: docker/login-action@v3
      #     with:
      #       registry: ghcr.io
      #       username: ${{ github.actor }}
      #       password: ${{ secrets.GITHUB_TOKEN }}
      #
      #   - name: Build and push
      #     uses: docker/build-push-action@v6
      #     with:
      #       context: .
      #       push: true
      #       tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      #
      #   - name: Deploy
      #     run: ./deploy.sh ghcr.io/${{ github.repository }}:${{ github.sha }}
      #     # e.g. kubectl set image, or a cloud-provider deploy CLI
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cicd-pipeline-template:${{ github.sha }}
